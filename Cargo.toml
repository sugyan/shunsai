[package]
name = "shunsai"
version = "0.1.0"
edition = "2024"
# Let-chains, not the edition, set this floor: edition 2024 alone would build
# on 1.85.
rust-version = "1.88"
authors = ["sugyan"]
description = "Fast shogi legal move generator — SHogi's Ultra-fast Next-gen Successor, for AI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sugyan/shunsai"
readme = "README.md"
keywords = ["shogi", "move-generation", "bitboard", "game", "usi"]
categories = ["game-development", "algorithms"]
# The published crate is the library. The project's own record (DESIGN,
# DECISIONS, BENCHMARKS), the fixtures and the committed measurement history
# are for people working in the repository, and are the bulk of the tree.
include = [
    "src",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[features]
# Exposes crate internals to `benches/` only (see `src/internals.rs`).
# Not public API: no stability guarantees, never enable as a dependency.
bench-internals = []
# M4 slider-attack backend selection (see src/sliders/). The default is
# `magic`, which won the bake-off; these flags override it. `magic` and
# `qugiy` compile either way, so a flag mostly changes which one the crate
# calls; `slider-naive` additionally brings in the oracle the tests compare
# against. Both overrides exist for A/B measurement and debugging, not for
# real use.
slider-naive = []
slider-qugiy = []

[dependencies]
shogi_core = "0.1.5"

[dev-dependencies]
criterion = "0.8"
shogi_legality_lite = "0.1"
shogi_usi_parser = "0.1"

# Keep libtest's bench harness off the lib so criterion CLI flags
# (e.g. `cargo bench -- --save-baseline x`) are not passed to libtest.
[lib]
bench = false

# Single bench target; the groups live in benches/suite/ and the internals
# group is compiled in via the bench-internals feature.
[[bench]]
name = "suite"
harness = false

# Benchmark conditions from BENCHMARKS.md (applies to examples/tests built here)
[profile.release]
lto = "fat"
codegen-units = 1
